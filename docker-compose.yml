services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: landsync
      POSTGRES_USER: landsync
      POSTGRES_PASSWORD: landsync
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landsync -d landsync"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  migrate:
    image: postgis/postgis:16-3.4
    environment:
      PGPASSWORD: landsync
    volumes: ["./infra/migrations:/migrations:ro"]
    depends_on:
      db: {condition: service_healthy}
    command: ["sh", "-c", "psql -h db -U landsync -d landsync -f /migrations/001_initial.sql"]
  api:
    build: ./apps/api
    environment:
      LOCAL_STORAGE_ROOT: /data
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    volumes: ["./.landsync-storage:/data"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  web:
    build: ./apps/web
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:
